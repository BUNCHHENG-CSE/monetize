# ==============================================================================
# Production-Optimized PostgreSQL Configuration for Local WSL Docker & Cloud DB
# ==============================================================================

# Connectivity & Connections
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# Memory Optimization (Tuned for high-performance SSD & modern multi-core)
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 128MB
work_mem = 16MB
huge_pages = off

# Write Ahead Log (WAL) & Checkpointing
wal_level = replica
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Disk & Storage (SSD / Virtual Disk Tuning for WSL2)
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Concurrency & Parallel Execution
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 2

# Slow Query Telemetry & Performance Monitoring
log_min_duration_statement = 250 # Log queries exceeding 250ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_timezone = 'UTC'

# Locale & Character Encoding
timezone = 'UTC'
client_encoding = 'utf8'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# Autovacuum Optimization for high-frequency usage_logs append
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 500
